# Internal changelog, generated from conventional commits:
#   uvx git-cliff -o CHANGELOG.md
# The user-facing changelog is written by hand in
# fastlane/metadata/android/en-US/changelogs/<versionCode>.txt

[changelog]
header = """
# Changelog

Internal changelog for developers, generated from commit messages with git-cliff. \
The user-facing notes are in `fastlane/metadata/android/en-US/changelogs/`.\n
"""
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^build", group = "<!-- 4 -->Build" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^docs", group = "<!-- 6 -->Docs" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = "^test", group = "<!-- 8 -->Tests" },
]
